<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky to Spin - Game Show</title>
    <style>
        :root {
            --primary: #ffd700;
            --secondary: #ff3366;
            --dark: #1a0b2e;
            --light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #3d1b6d 0%, var(--dark) 100%);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 3rem;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #b39ddb;
            margin-top: 0.5rem;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 2.5rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .dashboard {
            display: flex;
            gap: 3rem;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .stat-box {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.5rem 1.5rem;
            border-radius: 10px;
            border-bottom: 3px solid var(--primary);
        }

        .stat-box span {
            display: block;
            color: var(--primary);
            font-size: 2rem;
        }

        .wheel-outer {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 12px solid var(--primary);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(0,0,0,0.6);
            overflow: visible;
        }

        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid var(--secondary);
            z-index: 10;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5));
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .spin-btn {
            background: linear-gradient(135deg, #ff3366 0%, #cc0044 100%);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 51, 102, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 51, 102, 0.6);
        }

        .spin-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .spin-btn:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        .message-box {
            height: 30px;
            font-size: 1.3rem;
            font-weight: 500;
            color: #ffd700;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Lucky to Spin</h1>
        <div class="subtitle">Will fortune favor you tonight?</div>
    </header>

    <div class="game-container">
        <div class="dashboard">
            <div class="stat-box">Score <span id="score-display">0</span></div>
            <div class="stat-box">Spins Left <span id="spins-display">5</span></div>
        </div>

        <div class="wheel-outer">
            <div class="wheel-pointer"></div>
            <canvas id="wheel-canvas" class="wheel" width="400" height="400"></canvas>
        </div>

        <div class="message-box" id="msg-box">Press SPIN to test your luck!</div>

        <button class="spin-btn" id="spin-button" onclick="spinWheel()">Spin!</button>
    </div>

    <script>
        // Exactly 16 segments. Index 0 is the single Gold Spot.
        const prizes = [
            { label: "JACKPOT", value: 5000, color: "#ffd700", textColor: "#000" }, // The Single Gold Spot
            { label: "$100", value: 100, color: "#3a1f5d" },
            { label: "$200", value: 200, color: "#4e2a7f" },
            { label: "BANKRUPT", value: -1, color: "#d32f2f" },
            
            { label: "$500", value: 500, color: "#5c3396" },
            { label: "$150", value: 150, color: "#3a1f5d" },
            { label: "$300", value: 300, color: "#4e2a7f" },
            { label: "LOSE SPIN", value: -2, color: "#f57c00" },
            
            { label: "$1,000", value: 1000, color: "#5c3396" },
            { label: "$50", value: 50, color: "#3a1f5d" },
            { label: "$250", value: 250, color: "#4e2a7f" },
            { label: "BANKRUPT", value: -1, color: "#d32f2f" },
            
            { label: "$750", value: 750, color: "#5c3396" },
            { label: "$100", value: 100, color: "#3a1f5d" },
            { label: "$400", value: 400, color: "#4e2a7f" },
            { label: "FREE SPIN", value: 0, color: "#2e7d32" }
        ];

        let score = 0;
        let spinsLeft = 5;
        let isSpinning = false;
        let currentRotation = 0;

        const canvas = document.getElementById("wheel-canvas");
        const ctx = canvas.getContext("2d");
        const numSlices = prizes.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        const center = canvas.width / 2;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Step 1: Draw the background triangles
            for (let i = 0; i < numSlices; i++) {
                const angle = i * sliceAngle;
                
                ctx.beginPath();
                ctx.fillStyle = prizes[i].color;
                ctx.moveTo(center, center);
                ctx.arc(center, center, center, angle, angle + sliceAngle);
                ctx.lineTo(center, center);
                ctx.fill();

                // Standard subtle separator line
                ctx.strokeStyle = "rgba(255,255,255,0.15)";
                ctx.lineWidth = 1;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = prizes[i].textColor || "#ffffff";
                ctx.font = "bold 13px Arial";
                ctx.fillText(prizes[i].label, center - 20, 5);
                ctx.restore();
            }

            // Step 2: Overlay thick black border lines every 4th spot
            for (let i = 0; i < numSlices; i++) {
                if (i % 4 === 0) {
                    const angle = i * sliceAngle;
                    ctx.beginPath();
                    ctx.strokeStyle = "#000000";
                    ctx.lineWidth = 5; // Thick lines
                    ctx.moveTo(center, center);
                    // Draw line out to the edge of the circle
                    ctx.lineTo(center + center * Math.cos(angle), center + center * Math.sin(angle));
                    ctx.stroke();
                }
            }
        }

        function spinWheel() {
            if (isSpinning || spinsLeft <= 0) return;

            isSpinning = true;
            spinsLeft--;
            document.getElementById("spins-display").innerText = spinsLeft;
            document.getElementById("spin-button").disabled = true;
            document.getElementById("msg-box").innerText = "Spinning...";

            const prizeIndex = Math.floor(Math.random() * numSlices);
            
            // Match alignment so selected wedge lands directly at the top index pointer position
            const targetAngle = (prizeIndex * sliceAngle) + (sliceAngle / 2);
            const stopAngle = (3 * Math.PI / 2) - targetAngle;
            const additionalRotations = 6 * 2 * Math.PI; 
            currentRotation = stopAngle + additionalRotations;

            const wheelElement = document.getElementById("wheel-canvas");
            wheelElement.style.transform = `rotate(${currentRotation}rad)`;

            setTimeout(() => {
                isSpinning = false;
                const result = prizes[prizeIndex];
                
                if (result.value === -1) {
                    score = 0;
                    document.getElementById("msg-box").innerText = "Oh no! Bankrupt!";
                } else if (result.value === -2) {
                    spinsLeft = Math.max(0, spinsLeft - 1);
                    document.getElementById("msg-box").innerText = "Ouch! You lost a spin!";
                    document.getElementById("spins-display").innerText = spinsLeft;
                } else if (result.label === "FREE SPIN") {
                    spinsLeft++;
                    document.getElementById("msg-box").innerText = "Awesome! Free Spin awarded!";
                    document.getElementById("spins-display").innerText = spinsLeft;
                } else {
                    score += result.value;
                    if (result.color === "#ffd700") {
                        document.getElementById("msg-box").innerText = `💥 GOLD SPOT! You hit the JACKPOT for $${result.value}! 💥`;
                    } else {
                        document.getElementById("msg-box").innerText = `You landed on ${result.label}!`;
                    }
                }

                document.getElementById("score-display").innerText = score;

                if (spinsLeft > 0) {
                    document.getElementById("spin-button").disabled = false;
                } else {
                    document.getElementById("msg-box").innerText = `Game Over! Final Score: $${score}`;
                }
            }, 4000); 
        }

        drawWheel();
    </script>
</body>
</html>
