<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky AI Spin - Live Game Show</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stage-wrapper">
    <h1 class="game-title">Lucky AI Spin</h1>
    <div class="game-subtitle">Digital Product Edition</div>
    
    <div class="podium-grid">
      <!-- TIER 1 WHEEL ($25) -->
      <div class="wheel-podium style-w1">
        <h3 class="tier-header tier-1-color">Tier 1</h3>
        <div class="tier-value">$25 Digital Assets</div>
        <div class="ticker-pin">▼</div>
        <div class="wheel-container">
          <svg class="wheel-svg" id="w1" viewBox="0 0 200 200"></svg>
          <div class="center-cap"></div>
        </div>
        <button class="spin-button" id="btn-w1" onclick="spinEngine('w1')">Spin Tier 1</button>
      </div>

      <!-- TIER 2 WHEEL ($75) -->
      <div class="wheel-podium style-w2">
        <h3 class="tier-header tier-2-color">Tier 2</h3>
        <div class="tier-value">$75 Premium Bundles</div>
        <div class="ticker-pin">▼</div>
        <div class="wheel-container">
          <svg class="wheel-svg" id="w2" viewBox="0 0 200 200"></svg>
          <div class="center-cap"></div>
        </div>
        <button class="spin-button" id="btn-w2" onclick="spinEngine('w2')">Spin Tier 2</button>
      </div>

      <!-- TIER 3 WHEEL ($299) -->
      <div class="wheel-podium style-w3">
        <h3 class="tier-header tier-3-color">Tier 3</h3>
        <div class="tier-value">$299 Mega Courses</div>
        <div class="ticker-pin">▼</div>
        <div class="wheel-container">
          <svg class="wheel-svg" id="w3" viewBox="0 0 200 200"></svg>
          <div class="center-cap"></div>
        </div>
        <button class="spin-button" id="btn-w3" onclick="spinEngine('w3')">Spin Tier 3</button>
      </div>
    </div>
  </div>

  <!-- MYSTERY ITEM MODAL SELECTION DISPLAY -->
  <div class="modal-overlay" id="boxModal">
    <div class="modal-content" id="modalFrame">
      <h2 id="modalTitle">Section Unlocked!</h2>
      <p>Open your digital mystery packages one by one:</p>
      <div class="boxes-grid" id="boxesGrid"></div>
      <button class="close-btn" onclick="closeModal()">Next Round</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
